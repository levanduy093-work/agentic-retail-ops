services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: medusa-dtc-starter
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - agent-redis-data:/data
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - agent-qdrant-data:/qdrant/storage
  cloudflared:
    image: cloudflare/cloudflared:latest
    pull_policy: always
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - telegram-tunnel
    restart: unless-stopped

volumes:
  agent-redis-data:
  agent-qdrant-data:
